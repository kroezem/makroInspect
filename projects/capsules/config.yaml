segmentation:
  description: "pill"
  enabled: true
  multi_instance: true
  apply_mask: false
  batch_limit: 8


crop:
  reference_id: "000000000_00"
  align_PCA: true
  angle_candidates: [0]
  offset_rotation: 0
  scale: 1.0
  batch_limit: 128

transformer:
  token_budget: 294912
  patch_size: 14
  map_resolution: [48, 24]

anomaly_score:
  cmap: "MAGMA"   # Options: MAGMA, JET, TURBO, INFERNO, PLASMA, VIRIDIS

  method: mean
  min_percentile: 99.0
  max_percentile: 99.9

memory_bank:
  max_tokens: 524288
  replacement:
    policy: coverage
    interval: 128




