# -----------------------------------------------------------------------------
# Segmentation (SAM)
# -----------------------------------------------------------------------------
segmentation:
  prompts: [ "zipper" ]        # Text prompt for SAM (e.g., "capsule", "PCB component")
  enabled: false
  multi_instance: true          # True: each mask = separate instance. False: union all masks.

# -----------------------------------------------------------------------------
# Crop (PCA Alignment)
# -----------------------------------------------------------------------------
crop:
  reference_id: null            # Instance ID for alignment reference (null = use first)
  align_PCA: true               # Enable PCA-based rotation alignment
  angle_candidates: [ 0 ]    # Rotation angles to try during alignment
  offset_rotation: 0            # Additional rotation offset (degrees)
  scale: 1.0                    # Scale factor for crop output

# -----------------------------------------------------------------------------
# Transformer / Embedding
# -----------------------------------------------------------------------------
transformer:
  # Output feature map size [rows, cols]
  # This determines:
  #   - Crop output size = map_resolution * patch_size (from system config)
  #   - Heatmap resolution
  #   - Tokens per instance (rows * cols)
  #   - Effective batch sizes for embed/score
  patch_size: 14
  map_resolution: [ 48, 48 ]


# -----------------------------------------------------------------------------
# Memory Bank
# -----------------------------------------------------------------------------
memory_bank:
  max_gb: 6
  selection_method: "k_center"  # k_center, random


# -----------------------------------------------------------------------------
# Heatmap post-processing
# -----------------------------------------------------------------------------
refine:
  method: "gaussian"
  gaussian_sigma: 5

# -----------------------------------------------------------------------------
# Anomaly Scoring
# -----------------------------------------------------------------------------
score:
  # Aggregation method for computing scalar score from heatmap
  method: "mean"                # mean, max, median, min

  # Percentile bounds for score computation
  # Score = aggregation of heatmap values between these percentiles
  min_percentile: 99.9
  max_percentile: 99.999
